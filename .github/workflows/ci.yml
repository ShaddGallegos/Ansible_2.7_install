---
name: CI

"on":
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      run_shell_tests:
        description: "Run shell syntax, shellcheck, and shell tests"
        required: true
        type: boolean
        default: true
      run_ansible_syntax:
        description: "Run Ansible playbook syntax checks"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci-status:
    name: CI status and gating summary
    runs-on: ubuntu-latest
    steps:
      - name: Report CI gate state
        run: |
          echo "Repository variable AAP27_CI_ENABLED='${{ vars.AAP27_CI_ENABLED }}'"
          echo "Event='${{ github.event_name }}'"
          if [ "${{ vars.AAP27_CI_ENABLED }}" = "true" ]; then
            echo "CI is enabled for push/pull_request events."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run requested. Job toggles are controlled by workflow inputs."
            echo "run_shell_tests='${{ github.event.inputs.run_shell_tests }}'"
            echo "run_ansible_syntax='${{ github.event.inputs.run_ansible_syntax }}'"
          else
            echo "CI is optional and currently disabled for automatic events."
            echo "Set repository variable AAP27_CI_ENABLED=true to enable push/pull_request jobs."
            echo "Or run this workflow manually from the Actions tab."
          fi

  shell-and-unit-tests:
    name: Shell checks and script tests
    runs-on: ubuntu-latest
    needs: [ci-status]
    if: >-
      vars.AAP27_CI_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_shell_tests == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: >-
          bash -n aap27_menu_installer.sh lib/*.sh tests/*.sh

      - name: Shellcheck main script
        run: >-
          shellcheck aap27_menu_installer.sh lib/*.sh tests/*.sh

      - name: Run shell test suite
        run: bash tests/test_aap27_menu_installer.sh

      - name: Check repository hygiene
        run: bash tests/check_repository_hygiene.sh

  ansible-syntax:
    name: Ansible playbook syntax
    runs-on: ubuntu-latest
    needs: [ci-status]
    if: >-
      vars.AAP27_CI_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_ansible_syntax == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Install collections
        working-directory: aap_workflow_project
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint maintained YAML
        run: yamllint .

      - name: Lint maintained Ansible
        run: >-
          ansible-lint roles/aap27_rootless_podman roles/aap27_defaults
          roles/aap27_preflight roles/aap27_menu_installer
          aap_workflow_project/playbooks

      - name: Run playbook syntax checks
        working-directory: aap_workflow_project
        run: |
          set -euo pipefail
          for p in playbooks/*.yml; do
            echo "Syntax checking: $p"
            ansible-playbook --syntax-check -i inventory/controller.ini.example "$p"
          done
