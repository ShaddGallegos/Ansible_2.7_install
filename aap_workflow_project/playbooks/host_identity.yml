---
- name: Configure host identity for AAP install
  hosts: all
  become: true
  gather_facts: true

  vars:
    effective_target_fqdn: "{{ target_fqdn | default(default_fqdn) }}"
    platform_admin_user: "{{ admin_user | default('admin') }}"
    platform_admin_home: "{{ admin_home | default('/home/' ~ platform_admin_user) }}"
    effective_admin_password: "{{ admin_password | default('') }}"

  tasks:
    - name: Set hostname to target FQDN
      ansible.builtin.hostname:
        name: "{{ effective_target_fqdn }}"

    - name: Compute primary IP
      ansible.builtin.set_fact:
        primary_ip: "{{ ansible_default_ipv4.address | default((ansible_all_ipv4_addresses | first), true) }}"

    - name: Ensure /etc/hosts entry with aap alias
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: ".*\\s{{ effective_target_fqdn | regex_escape }}(\\s|$)"
        line: "{{ primary_ip }} {{ effective_target_fqdn }} aap"
        state: present

    - name: Ensure admin user exists
      ansible.builtin.user:
        name: "{{ platform_admin_user }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Set admin password when provided
      ansible.builtin.user:
        name: "{{ platform_admin_user }}"
        password: "{{ effective_admin_password | password_hash('sha512') }}"
      no_log: true
      when: effective_admin_password | length > 0

    - name: Configure passwordless sudo for admin
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ platform_admin_user }}"
        content: "{{ platform_admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"

    - name: Ensure admin .ssh dir exists
      ansible.builtin.file:
        path: "{{ platform_admin_home }}/.ssh"
        state: directory
        owner: "{{ platform_admin_user }}"
        group: "{{ platform_admin_user }}"
        mode: "0700"

    - name: Generate admin ssh key if missing
      become: true
      become_user: "{{ platform_admin_user }}"
      community.crypto.openssh_keypair:
        path: "{{ platform_admin_home }}/.ssh/id_ed25519"
        type: ed25519
        state: present
