---
- name: Download AAP bundle to target host
  hosts: all
  become: true
  gather_facts: true

  vars:
    platform_admin_user: "{{ admin_user | default('admin') }}"
    platform_admin_home: "{{ admin_home | default('/home/' ~ platform_admin_user) }}"
    admin_download_dir: "{{ platform_admin_home }}/Downloads"
    effective_bundle_url: "{{ bundle_url | default(default_bundle_url) }}"
    effective_bundle_file: "{{ bundle_file | default(default_bundle_file) }}"

  tasks:
    - name: Ensure platform download directory exists
      ansible.builtin.file:
        path: "{{ admin_download_dir }}"
        state: directory
        owner: "{{ platform_admin_user }}"
        group: "{{ platform_admin_user }}"
        mode: "0755"

    - name: Download bundle file
      ansible.builtin.get_url:
        url: "{{ effective_bundle_url }}"
        dest: "{{ admin_download_dir }}/{{ effective_bundle_file }}"
        mode: "0644"
        owner: "{{ platform_admin_user }}"
        group: "{{ platform_admin_user }}"

    - name: Extract bundle
      ansible.builtin.unarchive:
        src: "{{ admin_download_dir }}/{{ effective_bundle_file }}"
        dest: "{{ admin_download_dir }}"
        remote_src: true
        owner: "{{ platform_admin_user }}"
        group: "{{ platform_admin_user }}"
