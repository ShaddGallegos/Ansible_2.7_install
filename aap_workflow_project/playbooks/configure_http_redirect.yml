---
- name: Configure AAP HTTP to HTTPS redirect
  hosts: controller
  become: true
  gather_facts: false

  vars:
    platform_admin_user: "{{ ADMIN_USER | default('admin') }}"
    platform_admin_home: "{{ ADMIN_HOME | default('/home/' ~ platform_admin_user) }}"
    AAP_CONTROLLER_FQDN: "{{ AAP_SHORTNAME | default('aap') }}.{{ AAP_DOMAIN_NAME | default('prod.spg') }}"

  roles:
    - role: aap27_http_redirect
      vars:
        aap27_http_redirect_user: "{{ platform_admin_user }}"
        aap27_http_redirect_home: "{{ platform_admin_home }}"
        aap27_http_redirect_fallback_host: "{{ AAP_CONTROLLER_FQDN }}"
