---
- name: AAP prework on target host
  hosts: controller
  become: true
  gather_facts: true

  vars:
    prework_disable_firewall: "{{ disable_firewall_for_install | default(false) }}"
    prework_set_selinux_permissive: "{{ set_selinux_permissive_for_install | default(false) }}"
    effective_registry_username: "{{ rhsm_username | default(registry_username | default('')) }}"
    effective_registry_password: "{{ rhsm_password | default(registry_password | default('')) }}"
    installer_user: "{{ remote_user | default(machine_credential_username | default('admin')) }}"
    preflight_min_cpu: "{{ min_cpu | default(4) }}"
    preflight_min_ram_gb: "{{ min_ram_gb | default(16) }}"
    preflight_min_disk_gb: "{{ min_disk_gb | default(40) }}"
    preflight_fail_on_insufficient: "{{ fail_on_insufficient_resources | default(false) }}"

  handlers:
    - name: Restart SSH service
      ansible.builtin.systemd_service:
        name: sshd
        enabled: true
        state: restarted

  tasks:
    - name: Validate target host resource capacity
      ansible.builtin.include_role:
        name: aap27_preflight
      vars:
        aap27_preflight_min_cpu: "{{ preflight_min_cpu }}"
        aap27_preflight_min_ram_gb: "{{ preflight_min_ram_gb }}"
        aap27_preflight_min_disk_gb: "{{ preflight_min_disk_gb }}"
        aap27_preflight_fail_on_insufficient: "{{ preflight_fail_on_insufficient }}"

    - name: Install required packages (best effort)
      ansible.builtin.dnf:
        name:
          - sudo
          - openssh-server
          - openssh-clients
          - policycoreutils-python-utils
          - tar
          - gzip
          - curl
          - jq
          - rsync
          - sshpass
          - podman
          - podman-docker
          - python3
          - python3-pip
        state: present
      when: ansible_os_family == "RedHat"

    - name: Ensure common packages are installed (all distros)
      ansible.builtin.package:
        name:
          - sshpass
          - podman
          - podman-docker
        state: present

    - name: Enable passwordless sudo for installer user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/99_aap_installer_nopasswd"
        content: "{{ installer_user }} ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: 'visudo -cf %s'
      when: installer_user != 'root'

    - name: Ensure system SSH client configuration directory exists
      ansible.builtin.file:
        path: /etc/ssh/ssh_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Disable SSH host-key checking for installer workflows
      ansible.builtin.copy:
        dest: /etc/ssh/ssh_config.d/90-aap27-no-host-key-checking.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
      notify: Restart SSH service

    - name: Configure rootless Podman runtime for installer user
      ansible.builtin.include_role:
        name: aap27_rootless_podman
      vars:
        aap27_rootless_podman_user: "{{ installer_user }}"
        aap27_rootless_podman_install_packages: false
        aap27_rootless_podman_enable_rootful_socket: true
        aap27_rootless_podman_fail_on_missing_bus: false
        aap27_rootless_podman_registry_login: >-
          {{ (effective_registry_username | length > 0) and
             (effective_registry_password | length > 0) }}
        aap27_rootless_podman_registry_username: "{{ effective_registry_username }}"
        aap27_rootless_podman_registry_password: "{{ effective_registry_password }}"

    - name: Ensure podman temporary directory for image loads exists
      ansible.builtin.file:
        path: /var/tmp/podman-admin
        state: directory
        owner: "{{ installer_user }}"
        group: root
        mode: '1777'
      become: true

    - name: Disable firewalld for installation
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false
      when: prework_disable_firewall | bool

    - name: Set runtime SELinux permissive
      ansible.builtin.command: setenforce 0
      changed_when: false
      failed_when: false
      when: prework_set_selinux_permissive | bool

    - name: Set SELinux config permissive
      ansible.builtin.replace:
        path: /etc/selinux/config
        regexp: "^SELINUX=.*"
        replace: "SELINUX=permissive"
      when: prework_set_selinux_permissive | bool

- name: Ensure `sshpass` on installer (local control host)
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  tasks:
    - name: Ensure `sshpass` and podman are installed on installer host
      ansible.builtin.package:
        name:
          - sshpass
          - podman
          - podman-docker
        state: present
