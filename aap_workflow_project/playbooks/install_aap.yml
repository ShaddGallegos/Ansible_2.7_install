---
- name: Configure inventory-growth and install AAP 2.7
  hosts: all
  become: true
  gather_facts: true

  vars:
    installer_remote_user: "{{ remote_user | default(machine_credential_username | default('admin')) }}"
    platform_admin_user: "{{ admin_user | default('admin') }}"
    platform_admin_home: "{{ admin_home | default('/home/' ~ platform_admin_user) }}"
    installer_bundle_dir: >-
      {{ bundle_dir | default(platform_admin_home ~ '/Downloads/' ~
         (bundle_dir_name | default('ansible-automation-platform-containerized-setup-bundle-2.7-2-x86_64'))) }}
    installer_inventory_file: "{{ installer_bundle_dir }}/inventory-growth"
    target_fqdn: "{{ default_fqdn | default('aap.example.com') }}"
    remote_user_uid: "1000"
    admin_password: ""
    rhsm_username: "{{ registry_username | default('') }}"
    rhsm_password: "{{ registry_password | default('') }}"
    execution_playbook: "install"
    runtime_host_line: >-
      ansible_host={{ ansible_default_ipv4.address }} real_hostname={{ ansible_hostname }}
      ansible_user={{ installer_remote_user }} ansible_ssh_private_key_file=/home/{{ installer_remote_user }}/.ssh/id_ed25519
    allowed_execution_playbooks:
      - install
      - backup
      - bundle
      - install_standalone_mcp
      - log_gathering
      - restore
      - uninstall

  tasks:
    - name: Ensure requested remote user is non-root
      ansible.builtin.assert:
        that:
          - installer_remote_user != 'root'
        fail_msg: "remote_user must be non-root for ansible.containerized_installer preflight checks"

    - name: Ensure survey remote_user matches machine credential username
      ansible.builtin.assert:
        that:
          - machine_credential_username is not defined or installer_remote_user == machine_credential_username
        fail_msg: >-
          remote_user '{{ installer_remote_user }}' must match machine_credential_username
          '{{ machine_credential_username | default('undefined') }}' so SSH user,
          rootless podman setup, and installer runtime remain aligned.

    - name: Validate inventory-growth exists
      ansible.builtin.stat:
        path: "{{ installer_inventory_file }}"
      register: inv_stat

    - name: Fail when inventory-growth missing
      ansible.builtin.fail:
        msg: "inventory-growth not found at {{ installer_inventory_file }}"
      when: not inv_stat.stat.exists

    - name: Replace example hostnames globally
      ansible.builtin.replace:
        path: "{{ installer_inventory_file }}"
        regexp: "aap\\.example\\.(com|org)"
        replace: "aap {{ runtime_host_line }}"

    - name: Normalize non-vars host lines for runtime user and host identity
      ansible.builtin.replace:
        path: "{{ installer_inventory_file }}"
        regexp: "^(?!#|\\[|\\s*$).+$"
        replace: "{{ target_fqdn }} {{ runtime_host_line }}"

    - name: Replace installer password placeholder
      ansible.builtin.replace:
        path: "{{ installer_inventory_file }}"
        regexp: "password=<set your own>"
        replace: "password={{ admin_password }}"
      no_log: true

    - name: Enable collections
      ansible.builtin.replace:
        path: "{{ installer_inventory_file }}"
        regexp: "collections=false"
        replace: "collections=true"

    - name: Ensure [all:vars] exists
      ansible.builtin.lineinfile:
        path: "{{ installer_inventory_file }}"
        line: "[all:vars]"
        state: present

    - name: Set required all:vars entries
      ansible.builtin.blockinfile:
        path: "{{ installer_inventory_file }}"
        marker: "# {mark} MANAGED BY AAP WORKFLOW"
        insertafter: "^\\[all:vars\\]$"
        block: |
          admin_password='{{ admin_password }}'
          pg_admin_password='{{ admin_password }}'
          registry_username='{{ rhsm_username }}'
          registry_password='{{ rhsm_password }}'
          ansible_user='{{ installer_remote_user }}'
          ansible_become='true'
          ansible_become_method='sudo'
          ansible_connection='ssh'
          no_log: true

    - name: Validate requested execution playbook
      ansible.builtin.assert:
        that:
          - execution_playbook in allowed_execution_playbooks
        fail_msg: >-
          execution_playbook '{{ execution_playbook }}' is invalid. Allowed values:
          {{ allowed_execution_playbooks | join(', ') }}

    - name: Revalidate rootless Podman runtime before installer execution
      ansible.builtin.include_role:
        name: aap27_rootless_podman
      vars:
        aap27_rootless_podman_user: "{{ installer_remote_user }}"
        aap27_rootless_podman_create_user: false
        aap27_rootless_podman_install_packages: false
        aap27_rootless_podman_enable_rootful_socket: false
        aap27_rootless_podman_registry_login: false
        aap27_rootless_podman_fail_on_missing_bus: false
        aap27_rootless_podman_fail_on_validation: false

    - name: Set runtime remote user UID
      ansible.builtin.set_fact:
        remote_user_uid: "{{ aap27_rootless_podman_uid }}"

    - name: Build nested forward variables from hostvars
      ansible.builtin.set_fact:
        nested_forward_vars: "{{ nested_forward_vars | default({}) | combine({item.key: item.value}) }}"
      loop: "{{ hostvars[inventory_hostname] | dict2items }}"
      when: item.key is match('(_password$|_host$|_user$|^registry_auth$|^redis_|^controller_|^hub_|^eda_|^automationmetrics_|^postgresql_)')
      no_log: true

    - name: Ensure sensible defaults for automationmetrics and related vars
      ansible.builtin.set_fact:
        nested_forward_vars: >-
          {{ nested_forward_vars | default({}) | combine({
            'ansible_become': true,
            'ansible_become_method': 'sudo',
            'registry_auth': (registry_auth | default(false)),
            'postgresql_admin_password': (postgresql_admin_password | default(admin_password | default(''))),
            'redis_mode': (redis_mode | default('standalone')),
            'redis_cluster': (redis_cluster | default(false)),
            'redis_cluster_mode': (redis_cluster_mode | default(false)),
            'controller_admin_password': (controller_admin_password | default(admin_password | default(''))),
            'controller_pg_host': (controller_pg_host | default('localhost')),
            'controller_pg_password': (controller_pg_password | default(controller_admin_password | default(admin_password | default('')))),
            'hub_admin_password': (hub_admin_password | default('')),
            'hub_pg_host': (hub_pg_host | default(controller_pg_host | default('localhost'))),
            'hub_pg_password': (hub_pg_password | default(controller_pg_password | default(admin_password | default('')))),
            'hub_pg_user': (hub_pg_user | default('postgres')),
            'eda_admin_password': (eda_admin_password | default(controller_admin_password | default(admin_password | default('')))),
            'eda_pg_host': (eda_pg_host | default(controller_pg_host | default('localhost'))),
            'eda_pg_password': (eda_pg_password | default(eda_admin_password | default(controller_pg_password | default(admin_password | default(''))))),
            'eda_pg_user': (eda_pg_user | default('postgres')),
            'automationmetrics_pg_host': (automationmetrics_pg_host | default(controller_pg_host | default('localhost'))),
            'automationmetrics_pg_password': (automationmetrics_pg_password | default(controller_pg_password | default(admin_password | default('')))),
            'automationmetrics_pg_user': (automationmetrics_pg_user | default('postgres')),
            'automationmetrics_admin_password': (automationmetrics_admin_password | default(controller_admin_password | default(admin_password | default('')))),
            'automationmetrics_controller_read_pg_host': (automationmetrics_controller_read_pg_host | default(controller_pg_host | default('localhost'))),
            'automationmetrics_controller_read_pg_user': (automationmetrics_controller_read_pg_user | default('postgres')),
            'automationmetrics_controller_read_pg_password': (automationmetrics_controller_read_pg_password | default(controller_pg_password | default(admin_password
          | default(''))))
          }) }}
      no_log: true

    - name: Write forwarded extra-vars file for nested installer
      ansible.builtin.copy:
        dest: "{{ installer_bundle_dir }}/forwarded_extra_vars.yml"
        content: "{{ nested_forward_vars | default({}) | to_nice_yaml }}\n"
        owner: "{{ platform_admin_user }}"
        group: "{{ platform_admin_user }}"
        mode: "0600"
      no_log: true

    - name: Run selected AAP containerized playbook
      become: true
      become_user: "{{ platform_admin_user }}"
      ansible.builtin.command:
        argv:
          - ansible-playbook
          - -i
          - inventory-growth
          - -c
          - local
          - -e
          - "ansible_user_uid={{ remote_user_uid }}"
          - -e
          - "@forwarded_extra_vars.yml"
          - "ansible.containerized_installer.{{ execution_playbook }}"
      args:
        chdir: "{{ installer_bundle_dir }}"
      register: install_result
      changed_when: true
