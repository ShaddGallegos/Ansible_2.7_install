---
- name: Prepare target-local inventory-growth
  hosts: controller
  become: true
  gather_facts: true

  tasks:
    - name: Apply inventory-growth role
      ansible.builtin.include_role:
        name: aap27_inventory_growth
      vars:
        aap27_inventory_growth_file: "{{ INVENTORY_GROWTH_FILE }}"
        aap27_inventory_growth_target_fqdn: "{{ AAP_CONTROLLER_FQDN }}"
        aap27_inventory_growth_target_address: "{{ AAP_CONTROLLER_IP }}"
        aap27_inventory_growth_real_hostname: "{{ ansible_facts['hostname'] }}"
        aap27_inventory_growth_admin_user: "{{ ADMIN_USER | default('admin') }}"
        aap27_inventory_growth_admin_home: "{{ ADMIN_HOME | default('/home/' ~ (ADMIN_USER | default('admin'))) }}"
        aap27_inventory_growth_admin_password: "{{ ADMIN_PASSWORD | default(INVENTORY_GROWTH_PASSWORD | default('')) }}"
        aap27_inventory_growth_registry_username: "{{ RHSM_USERNAME }}"
        aap27_inventory_growth_registry_password: "{{ RHSM_PASSWORD }}"
