---
- name: Set common tasks path
  ansible.builtin.set_fact:
    aap27_bundle_hotfixes_common_tasks: >-
      {{ aap27_bundle_hotfixes_bundle_dir ~
         '/collections/ansible_collections/ansible/containerized_installer/roles/common/tasks/main.yml' }}

- name: Normalize rootless Podman environment exports
  ansible.builtin.replace:
    path: "{{ aap27_bundle_hotfixes_common_tasks }}"
    regexp: '(?m)^([ \t]*)export TMPDIR="\$\{podman_tmpdir\}"\r?\n(?:[ \t]*export XDG_RUNTIME_DIR="/run/user/\{\{ ansible_user_uid \}\}"\r?\n[ \t]*export HOME="\{\{ ansible_user_dir \}\}"(?:[^\S\r\n]+|\r?\n))?[ \t]*(export CONTAINERS_STORAGE_CONF=.*)$'
    replace: |
      \1export TMPDIR="${podman_tmpdir}"
      \1export XDG_RUNTIME_DIR="/run/user/{{ '{{' }} ansible_user_uid {{ '}}' }}"
      \1export HOME="{{ '{{' }} ansible_user_dir {{ '}}' }}"
      \1\2
