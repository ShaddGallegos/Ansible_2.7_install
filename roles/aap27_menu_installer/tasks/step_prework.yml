---
## Ensure the system is registered with Red Hat Subscription Management (RHSM)
# and enable required repos before attempting to install packages. This
# attempts non-interactive registration using provided registry/RHSM
# credentials (falls back to no-op if already registered).
- name: Ensure RHSM registration and repos are configured (idempotent)
  become: true
  when:
    - ansible_os_family == 'RedHat'
    - (
        ((aap27_menu_installer_registry_username | default('')) | length) > 0 and
        ((aap27_menu_installer_registry_password | default('')) | length) > 0
      ) or (
        (RHSM_USERNAME is defined and (RHSM_USERNAME | length) > 0) and
        (RHSM_PASSWORD is defined and (RHSM_PASSWORD | length) > 0)
      )
  block:
    - name: Check if system is already registered with subscription-manager
      ansible.builtin.command:
        cmd: subscription-manager identity
      register: aap27_menu_installer_rhsm_identity
      failed_when: false
      changed_when: false

    - name: Set effective RHSM credentials for registration
      ansible.builtin.set_fact:
        aap27_menu_installer_effective_registry_username: "{{ aap27_menu_installer_registry_username | default(RHSM_USERNAME | default('')) }}"
        aap27_menu_installer_effective_registry_password: "{{ aap27_menu_installer_registry_password | default(RHSM_PASSWORD | default('')) }}"
      no_log: true

    - name: Register with subscription-manager when not registered
      ansible.builtin.command:
        argv:
          - subscription-manager
          - register
          - --username
          - "{{ aap27_menu_installer_effective_registry_username }}"
          - --password
          - "{{ aap27_menu_installer_effective_registry_password }}"
      register: aap27_menu_installer_rhsm_register
      failed_when: aap27_menu_installer_rhsm_register.rc != 0 and (aap27_menu_installer_rhsm_register.stderr is search("already registered") | not)
      no_log: true
      changed_when: false
      when: aap27_menu_installer_rhsm_identity.rc != 0

    - name: Attempt to auto-attach subscriptions (best-effort)
      ansible.builtin.command:
        cmd: subscription-manager attach --auto
      failed_when: false
      changed_when: false
      when: aap27_menu_installer_rhsm_identity.rc != 0

    - name: Determine RHEL major version and architecture facts
      ansible.builtin.set_fact:
        aap27_menu_installer_rhel_major: "{{ ansible_distribution_version.split('.')[:1] | join('') }}"
        aap27_menu_installer_arch: "{{ ansible_architecture }}"

    - name: Refresh subscription-manager data (best-effort)
      ansible.builtin.command:
        cmd: subscription-manager refresh
      failed_when: false
      changed_when: false
      when: aap27_menu_installer_rhsm_identity.rc == 0 or aap27_menu_installer_rhsm_register is defined

    - name: Enable required RHEL repos (best-effort)
      ansible.builtin.command:
        argv:
          - subscription-manager
          - repos
          - --enable
          - "rhel-{{ aap27_menu_installer_rhel_major }}-for-{{ aap27_menu_installer_arch }}-baseos-rpms"
          - --enable
          - "rhel-{{ aap27_menu_installer_rhel_major }}-for-{{ aap27_menu_installer_arch }}-appstream-rpms"
      failed_when: false
      changed_when: false
      when: aap27_menu_installer_rhsm_identity.rc == 0 or aap27_menu_installer_rhsm_register is defined

    - name: Enable CodeReady builder repo (best-effort)
      ansible.builtin.command:
        argv:
          - subscription-manager
          - repos
          - --enable
          - "codeready-builder-for-rhel-{{ aap27_menu_installer_rhel_major }}-{{ aap27_menu_installer_arch }}-rpms"
      failed_when: false
      changed_when: false
      when: aap27_menu_installer_rhsm_identity.rc == 0 or aap27_menu_installer_rhsm_register is defined

  # become/when moved above per ansible-lint key-order recommendation

- name: Install required packages (best effort)
  ansible.builtin.dnf:
    name:
      - sudo
      - openssh-server
      - openssh-clients
      - policycoreutils-python-utils
      - tar
      - gzip
      - curl
      - jq
      - rsync
      - sshpass
      - podman
      - podman-docker
      - python3
      - python3-pip
    state: present
    update_cache: yes
  become: true
  when: ansible_os_family == 'RedHat'

- name: Configure rootless Podman runtime for installer user
  ansible.builtin.include_role:
    name: aap27_rootless_podman
  vars:
    aap27_rootless_podman_user: "{{ aap27_menu_installer_remote_user }}"
    aap27_rootless_podman_install_packages: false
    aap27_rootless_podman_enable_rootful_socket: true
    aap27_rootless_podman_fail_on_missing_bus: false
    aap27_rootless_podman_registry_login: >-
      {{ (aap27_menu_installer_registry_username | length > 0) and
         (aap27_menu_installer_registry_password | length > 0) }}
    aap27_rootless_podman_registry_username: "{{ aap27_menu_installer_registry_username }}"
    aap27_rootless_podman_registry_password: "{{ aap27_menu_installer_registry_password }}"

- name: Disable firewalld for installation
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when: aap27_menu_installer_disable_firewall_for_install | bool

- name: Set runtime SELinux permissive
  ansible.builtin.command: setenforce 0
  changed_when: false
  failed_when: false
  when: aap27_menu_installer_set_selinux_permissive_for_install | bool

- name: Set SELinux config permissive
  ansible.builtin.replace:
    path: /etc/selinux/config
    regexp: "^SELINUX=.*"
    replace: SELINUX=permissive
  when: aap27_menu_installer_set_selinux_permissive_for_install | bool
