---
- name: Restart receptor user service
  listen: Restart receptor
  become: true
  ansible.builtin.command:
    cmd: systemctl --machine={{ ansible_user }}@ --user restart {{ _receptor_systemd_unit | default('container-receptor.service') }}
  register: _receptor_handler_restart_result
  failed_when: false

- name: Fallback to direct podman start when restart fails
  listen: Restart receptor
  become: true
  become_user: '{{ ansible_user }}'
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ ansible_user_uid }}'
    DBUS_SESSION_BUS_ADDRESS: 'unix:path=/run/user/{{ ansible_user_uid }}/bus'
  ansible.builtin.command:
    cmd: podman start receptor
  register: _receptor_handler_podman_start_result
  failed_when: false
  when: _receptor_handler_restart_result.rc | default(1) != 0

- name: Check receptor container state after handler restart
  listen: Restart receptor
  become: true
  become_user: '{{ ansible_user }}'
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ ansible_user_uid }}'
    DBUS_SESSION_BUS_ADDRESS: 'unix:path=/run/user/{{ ansible_user_uid }}/bus'
  ansible.builtin.command:
    cmd: podman inspect receptor --format {{"{{"}}.State.Status{{"}}"}}
  register: _receptor_handler_state_result
  changed_when: false
  failed_when: false

- name: Secondary running check via podman ps
  listen: Restart receptor
  become: true
  become_user: '{{ ansible_user }}'
  environment:
    XDG_RUNTIME_DIR: '/run/user/{{ ansible_user_uid }}'
    DBUS_SESSION_BUS_ADDRESS: 'unix:path=/run/user/{{ ansible_user_uid }}/bus'
  ansible.builtin.command:
    cmd: podman ps --filter name=^receptor$ --filter status=running --format {{"{{"}}.Names{{"}}"}}
  register: _receptor_handler_ps_result
  changed_when: false
  failed_when: false

- name: Warn when receptor is not running after restart attempts
  listen: Restart receptor
  ansible.builtin.debug:
    msg: >-
      Receptor handler could not confirm a running container; continuing.
      systemd_restart_rc={{ _receptor_handler_restart_result.rc | default('n/a') }}
      podman_start_rc={{ _receptor_handler_podman_start_result.rc | default('n/a') }}
      inspect_state={{ _receptor_handler_state_result.stdout | default('missing') }}
      ps_name={{ _receptor_handler_ps_result.stdout | default('missing') }}
  when:
    - (_receptor_handler_state_result.stdout | default('')) != 'running'
    - (_receptor_handler_ps_result.stdout | default('')) != 'receptor'
