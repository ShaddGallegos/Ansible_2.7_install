---
- name: Load role-local vaulted installer defaults
  ansible.builtin.include_vars:
    file: "{{ aap27_defaults_env_file }}"
    name: aap27_defaults_env_data
  no_log: false
  when: aap27_defaults_use_local_env | bool

- name: Merge common and project-specific sections into flat facts
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: >-
    {{
      ((aap27_defaults_env_data.common | default({}))
       | combine(aap27_defaults_env_data[aap27_defaults_project_key] | default({})))
      | dict2items
    }}
  no_log: false
  when: aap27_defaults_use_local_env | bool
